spring.application.name=rentar

# ========================================================
# CONFIGURACION DE CONEXION A BASE DE DATOS MYSQL (LOCAL)
# ========================================================
# La base de datos es 'Rentar' según el script Proyecto/BD/RentarBD.sql
spring.datasource.url=jdbc:mysql://localhost:3306/Rentar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del pool HikariCP
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# ========================================================
# JPA / HIBERNATE
# ========================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================================
# SWAGGER & OPENAPI
# ========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
